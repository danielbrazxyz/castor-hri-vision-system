<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">CASTOR Interaction Framework V4</title>
  <desc id="d">Banner em tema escuro: anéis concêntricos que representam as zonas proxêmicas em torno do robô, com uma criança rastreada e o vetor de olhar.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#0d1117" stroke="#30363d"/>

  <!-- proxêmica: quatro zonas ao redor do robô -->
  <circle cx="930" cy="150" r="190" fill="url(#glow)"/>
  <g stroke="#21262d" stroke-width="1">
    <line x1="802" y1="150" x2="1058" y2="150"/>
    <line x1="930" y1="22" x2="930" y2="278"/>
  </g>
  <g fill="none" stroke="#30363d" stroke-width="1">
    <circle cx="930" cy="150" r="32"/>
    <circle cx="930" cy="150" r="64"/>
    <circle cx="930" cy="150" r="96"/>
    <circle cx="930" cy="150" r="128" stroke-dasharray="3 6"/>
  </g>

  <!-- outros alvos rastreados -->
  <circle cx="810" cy="106" r="3" fill="#484f58"/>
  <circle cx="908" cy="210" r="3" fill="#484f58"/>

  <!-- vetor de olhar: criança -> robô -->
  <line x1="1009" y1="95" x2="930" y2="150" stroke="#58a6ff" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- robô -->
  <circle cx="930" cy="150" r="14" fill="#58a6ff" fill-opacity="0.18"/>
  <circle cx="930" cy="150" r="5" fill="#58a6ff"/>

  <!-- criança rastreada -->
  <path d="M997 89V83H1003M1015 83H1021V89M1021 101V107H1015M1003 107H997V101" fill="none" stroke="#58a6ff" stroke-width="1.2" stroke-linecap="square"/>
  <circle cx="1009" cy="95" r="4.5" fill="#f0f6fc"/>

  <!-- título -->
  <g font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="153" font-size="84" font-weight="700" letter-spacing="-2" fill="#f0f6fc">CASTOR</text>
    <text x="74" y="201" font-size="28" font-weight="400" fill="#8b949e">Interaction Framework V4</text>
  </g>
</svg>
